<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lume — Gastos Mensais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="app">

    <!-- ==========================================
         TELA 1 — SPLASH
    =========================================== -->
    <div class="screen" id="screen-splash">

        <div class="splash-hero">
            <!-- Ícone do app -->
            <div class="splash-icon">
                <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <line x1="19" y1="4"  x2="19" y2="34" stroke="#E85002" stroke-width="2.8" stroke-linecap="round"/>
                    <line x1="4"  y1="19" x2="34" y2="19" stroke="#E85002" stroke-width="2.8" stroke-linecap="round"/>
                    <line x1="8.1" y1="8.1"   x2="29.9" y2="29.9" stroke="#E85002" stroke-width="2.8" stroke-linecap="round"/>
                    <line x1="29.9" y1="8.1"  x2="8.1"  y2="29.9" stroke="#E85002" stroke-width="2.8" stroke-linecap="round"/>
                </svg>
            </div>
        </div>

        <div class="splash-body">
            <h1 class="splash-title">Bem-vindo ao Lume</h1>
            <p class="splash-sub">Controle seus gastos de forma inteligente</p>
            <button class="btn-continue" id="js-continue">Continuar</button>
            <button class="btn-skip"     id="js-skip">Pular</button>
        </div>

    </div>

    <!-- ==========================================
         TELA 2 — LOGIN
    =========================================== -->
    <div class="screen is-offscreen-right" id="screen-login">

        <div class="login-header">
            <h1 class="login-title">Sign in</h1>
            <p class="login-sub">New user? <a href="#">Create an account</a></p>
        </div>

        <!-- E-mail -->
        <div class="form-group">
            <div class="input-wrap">
                <span class="input-icon">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0
                               01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25
                               2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07
                               1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32
                               8.91a2.25 2.25 0 01-1.07-1.916V6.75"/>
                    </svg>
                </span>
                <input type="email" placeholder="Email Address" autocomplete="email">
            </div>
        </div>

        <!-- Senha -->
        <div class="form-group">
            <div class="input-wrap">
                <span class="input-icon">
                    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75
                               11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25
                               0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25
                               2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                    </svg>
                </span>
                <input type="password" id="js-pwd" placeholder="Password" autocomplete="current-password">
                <button class="input-eye" id="js-eye" type="button" aria-label="Mostrar senha">
                    <!-- Ícone olho fechado (padrão) -->
                    <svg id="eye-icon" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36
                               4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431
                               0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638
                               0-8.573-3.007-9.963-7.178z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="forgot"><a href="#">Forgot password?</a></div>

        <button class="btn-login" id="js-login">Login</button>

        <div class="divider">
            <div class="divider-line"></div>
            <span>or</span>
            <div class="divider-line"></div>
        </div>

        <p class="social-label">Join With Your Favourite Social Media Account</p>

        <div class="social-row">
            <!-- Google -->
            <button class="social-btn" aria-label="Google">
                <svg viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04
                             2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23
                             1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99
                             20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43
                             8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97
                             1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53
                             6.16-4.53z" fill="#EA4335"/>
                </svg>
            </button>

            <!-- Facebook -->
            <button class="social-btn" aria-label="Facebook">
                <svg viewBox="0 0 24 24">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99
                             4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007
                             1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491
                             0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612
                             23.027 24 18.062 24 12.073z" fill="#1877F2"/>
                </svg>
            </button>

            <!-- X / Twitter -->
            <button class="social-btn" aria-label="X">
                <svg viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99
                             21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161
                             17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </button>

            <!-- Apple -->
            <button class="social-btn" aria-label="Apple">
                <svg viewBox="0 0 24 24">
                    <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91
                             1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013
                             1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987
                             1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948
                             1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857
                             -.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376
                             -2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427
                             1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454
                             2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
                </svg>
            </button>
        </div>

        <p class="terms">
            By signing in with an account, you agree to SO's<br>
            <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>

    </div>

</div><!-- /app -->

<script src="assets/js/script.js"></script>
</body>
</html>
